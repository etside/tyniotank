name: Build & Deploy — match.hause.ink

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip test suite (emergency deploy)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build_date: ${{ steps.zip.outputs.build_date }}
      zip_size: ${{ steps.zip.outputs.zip_size }}
      zip_name: ${{ steps.zip.outputs.zip_name }}

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for release notes

      # ── 2. Setup Node 22 ──────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── 4. TypeScript type-check ──────────────────────────────────────────────
      - name: TypeScript check
        run: npx tsc --noEmit
        continue-on-error: true

      # ── 5. Lint ───────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      # ── 6. Unit tests ─────────────────────────────────────────────────────────
      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: npm test -- --reporter=verbose
        continue-on-error: true

      # ── 7. Build React frontend ───────────────────────────────────────────────
      - name: Build frontend
        env:
          VITE_API_URL: /api
          NODE_ENV: production
        run: npm run build

      # ── 8. Verify dist output ─────────────────────────────────────────────────
      - name: Verify build output
        run: |
          echo "── dist contents (top 2 levels) ──"
          find dist -maxdepth 2 | sort
          [ -f dist/index.html ] || (echo "ERROR: dist/index.html missing" && exit 1)
          echo "index.html ✓"
          ASSET_COUNT=$(find dist/assets -type f | wc -l)
          echo "Assets: $ASSET_COUNT files"
          [ "$ASSET_COUNT" -gt 0 ] || (echo "ERROR: no assets built" && exit 1)

      # ── 9. Inject production config.env from GitHub Secrets ───────────────────
      - name: Write production config.env
        env:
          DB_HOST:    ${{ secrets.DB_HOST }}
          DB_NAME:    ${{ secrets.DB_NAME }}
          DB_USER:    ${{ secrets.DB_USER }}
          DB_PASS:    ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SITE_URL:   ${{ secrets.SITE_URL }}
          SMTP_HOST:  ${{ secrets.SMTP_HOST }}
          SMTP_USER:  ${{ secrets.SMTP_USER }}
          SMTP_PASS:  ${{ secrets.SMTP_PASS }}
          SMTP_FROM:  ${{ secrets.SMTP_FROM }}
        run: |
          if [ -n "$DB_HOST" ]; then
            cat > api/config.env <<EOF
          DB_HOST=${DB_HOST}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASS=${DB_PASS}
          JWT_SECRET=${JWT_SECRET}
          SITE_URL=${SITE_URL:-https://match.hause.ink}
          SMTP_HOST=${SMTP_HOST:-localhost}
          SMTP_PORT=587
          SMTP_USER=${SMTP_USER:-}
          SMTP_PASS=${SMTP_PASS:-}
          SMTP_FROM=${SMTP_FROM:-no-reply@match.hause.ink}
          EOF
            echo "✓ config.env written from GitHub Secrets"
          else
            echo "⚠ DB_HOST secret not set — using committed config.env as-is"
          fi

      # ── 10. Assemble deployment package ───────────────────────────────────────
      - name: Assemble deployment package
        run: |
          set -e
          mkdir -p deploy/api
          mkdir -p deploy/uploads

          # React SPA build
          cp -r dist/. deploy/

          # SPA + API routing
          cp .htaccess deploy/.htaccess

          # Full PHP API backend
          cp -r api/. deploy/api/

          # Public static files
          for f in robots.txt sitemap.xml llms.txt favicon.ico; do
            [ -f "public/$f" ] && cp "public/$f" deploy/ && echo "Copied $f" || true
          done

          # Uploads placeholder
          cat > deploy/uploads/README.txt <<'EOF'
          Writable upload directory for admin media library.
          Set chmod 755 via cPanel File Manager after deployment.
          EOF

          echo "── Deploy package structure ──"
          find deploy -maxdepth 3 | sort

      # ── 11. Create timestamped ZIP ────────────────────────────────────────────
      - name: Create deployment ZIP
        id: zip
        run: |
          BUILD_DATE=$(date -u +%Y%m%d-%H%M)
          ZIP_NAME="match-hause-${BUILD_DATE}.zip"
          cd deploy
          zip -r ../"$ZIP_NAME" . \
            --exclude "*.DS_Store" \
            --exclude "__MACOSX*" \
            --exclude "*.map"     \
            --exclude ".git*"
          cd ..
          cp "$ZIP_NAME" match-hause-latest.zip
          ZIP_SIZE=$(du -sh "$ZIP_NAME" | cut -f1)
          echo "zip_name=$ZIP_NAME"     >> "$GITHUB_OUTPUT"
          echo "zip_size=$ZIP_SIZE"     >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "ZIP: $ZIP_NAME ($ZIP_SIZE)"

      # ── 12. Upload artifact (30-day retention) ────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: match-hause-${{ steps.zip.outputs.build_date }}
          path: match-hause-latest.zip
          retention-days: 30
          if-no-files-found: error

  deploy:
    name: Deploy via cPanel File Manager
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: match-hause-${{ needs.build.outputs.build_date }}
          path: ./deploy-zip

      - name: Deploy to cPanel via File Manager API
        env:
          CPANEL_URL:   ${{ secrets.CPANEL_URL }}
          CPANEL_USER:  ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_DOMAIN: ${{ secrets.CPANEL_DOMAIN || 'match.hause.ink' }}
        run: |
          set -e
          ZIP_FILE=$(ls deploy-zip/*.zip)
          echo "Deploying: $ZIP_FILE"

          # ── 1. Upload ZIP to cPanel File Manager ──────────────────────────
          echo "── Uploading ZIP to cPanel ──"
          UPLOAD_RESP=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
            -F "dir=/home/$CPANEL_USER/$CPANEL_DOMAIN" \
            -F "file-1=@$ZIP_FILE;filename=deploy.zip" \
            "$CPANEL_URL/execute/Fileman/upload_files")

          UPLOAD_HTTP=$(echo "$UPLOAD_RESP" | tail -1)
          UPLOAD_BODY=$(echo "$UPLOAD_RESP" | sed '$d')

          echo "Upload HTTP status: $UPLOAD_HTTP"
          echo "Upload response: $UPLOAD_BODY"

          if [ "$UPLOAD_HTTP" != "200" ]; then
            echo "ERROR: Upload failed (HTTP $UPLOAD_HTTP)"
            exit 1
          fi

          # Check if upload was successful
          if echo "$UPLOAD_BODY" | grep -q '"errors"'; then
            ERRORS=$(echo "$UPLOAD_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('errors',[]))" 2>/dev/null || echo "unknown")
            echo "ERROR: cPanel upload returned errors: $ERRORS"
            exit 1
          fi

          echo "✓ ZIP uploaded successfully"

          # ── 2. Extract ZIP on server ──────────────────────────────────────
          echo "── Extracting ZIP on server ──"
          EXTRACT_RESP=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "dir=/home/$CPANEL_USER/$CPANEL_DOMAIN" \
            -d "file=/home/$CPANEL_USER/$CPANEL_DOMAIN/deploy.zip" \
            -d "overwrite=1" \
            "$CPANEL_URL/execute/Fileman/extract_files")

          EXTRACT_HTTP=$(echo "$EXTRACT_RESP" | tail -1)
          EXTRACT_BODY=$(echo "$EXTRACT_RESP" | sed '$d')

          echo "Extract HTTP status: $EXTRACT_HTTP"
          echo "Extract response: $EXTRACT_BODY"

          if [ "$EXTRACT_HTTP" != "200" ]; then
            echo "ERROR: Extraction failed (HTTP $EXTRACT_HTTP)"
            exit 1
          fi

          echo "✓ ZIP extracted successfully"

          # ── 3. Delete the uploaded ZIP ────────────────────────────────────
          echo "── Cleaning up ZIP ──"
          DELETE_RESP=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "dir=/home/$CPANEL_USER/$CPANEL_DOMAIN" \
            -d "files=deploy.zip" \
            "$CPANEL_URL/execute/Fileman/delete_files")

          DELETE_HTTP=$(echo "$DELETE_RESP" | tail -1)
          echo "Delete HTTP status: $DELETE_HTTP"
          echo "✓ Cleanup done"

      - name: Verify deployment
        run: |
          echo "Checking https://match.hause.ink..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://match.hause.ink/ --max-time 10)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ]; then
            echo "✓ Site is responding"
          else
            echo "⚠ Site returned $HTTP_STATUS — check deployment"
          fi

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ github.run_number }}
          name: "Deploy #${{ github.run_number }} — match.hause.ink"
          body: |
            ## engineersTech Marketplace — match.hause.ink

            | Field | Value |
            |---|---|
            | Build | #${{ github.run_number }} |
            | Commit | [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
            | Branch | `${{ github.ref_name }}` |
            | ZIP size | `${{ needs.build.outputs.zip_size }}` |
            | Built at | `${{ needs.build.outputs.build_date }} UTC` |

            ---

            ### Deployed to
            - **Frontend:** https://match.hause.ink
            - **API:** https://match.hause.ink/api/
            - **MCP Server:** https://match.hause.ink/api/mcp-server
            - **OAuth Discovery:** https://match.hause.ink/.well-known/oauth-authorization-server

            ### Post-deploy checklist
            - [ ] Site loads at https://match.hause.ink
            - [ ] Products page works (/products)
            - [ ] Services page works (/marketplace-services)
            - [ ] Cart and checkout flow works
            - [ ] API endpoints respond (/api/products, /api/services)
            - [ ] MCP server responds (/api/mcp-server)
          draft: false
          prerelease: false
          make_latest: true
